name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest uploaded PDFs
        run: node tools/generate-pdf-manifest.mjs

      - name: Collect public site files
        run: |
          mkdir _site
          cp -r index.html style.css script.js assets _site/
          # Stable links for outside documents (e.g. slides): /pdf/<key>.pdf always serves the latest file
          node -e "const fs=require('fs');const m=require('./assets/pdf/latest.json');fs.mkdirSync('_site/pdf');for(const[k,f]of Object.entries(m))fs.copyFileSync('assets/pdf/'+f,'_site/pdf/'+k+'.pdf')"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
